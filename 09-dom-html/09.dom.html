  <button class="js-button">Second hello</button>

    console.log(document.querySelector('button'));
    console.log(document.querySelector('js-button'));

    // select only  button  with js-button class
    // checking the innerHTML attributes 
    const buttonElement = document.querySelector('. js-button');
    console.log(buttonElement);
    console.log(buttonElement.innerHTML);

    // changed the inner name for the button with   javascript with innerHTML and console.log to print it   in the terminal.
    buttonElement.innerHTML = "Change";
    console.log(buttonElement.innerHTML);
