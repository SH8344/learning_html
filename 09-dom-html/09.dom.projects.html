<!DOCTYPE html>
<html>
  <head>
    <title> DOM Projects </title>
  </head>
  <body>
    <p> YouTube Subscribe Button </p>
    <button onclick= "subscribe();" 
    class="js-subscribe-button">
      Subscribe
    </button>

    <p>Amazon shipping Calculator </p>
    <input placeholder="Cost of order" class="js-cost-input"
      onkeydown="console.log(event);
      handleCostKeyDown(event);
        ">

    <button onclick="caculateTotal();">Caculate</button>
    <p class="js-total-cost"></p>

    <script>
      function handleCostKeyDown(event) {
        if (event.key === 'Enter'){
          caculateTotal();
        }
      }
      function caculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');
        console.log({inputElement:inputElement});
        let cost = Number(inputElement.value);

        if (cost < 40) {
          cost = cost + 10;
        }

        document.querySelector('.js-total-cost')
          .innerHTML = `$${cost}`;
      }

      // subscirbe function that uses if or else statement to update the button text (innerText) 
      function subscribe() {
        const buttonElement =
          document.querySelector('.js-subscribe-button');

        if (buttonElement.innerText === 'Subscribe') {
          buttonElement.innerText = 'Subscribed';
        } else {
          buttonElement.innerText = 'Subscribe';
        }
      }
    </script>
  </body>
</html>
