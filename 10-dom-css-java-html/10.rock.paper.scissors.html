 <!DOCTYPE html>
<html>
    <head>
      <style>
        body { 
          background-color: rgb(25,25,25);
          color: white;

          font: arial;
        }
        .move-icon{
          
          height: 50px;

        }
        .move-button{
          background-color: transparent;

          border: 3px solid white;

          width: 120px ;
          height: 120px;
          border-radius: 60px ;
          margin-right: 10px;
          cursor: pointer;
        }


        .result {
          font-weight: bold;
          font-size: 25px;
          margin: 50px;

        }
      </style>
        <title>
        Rock Paper Scissors
        </title>


            <p> Rock Paper Scissors</p>
            <button onclick="
            playGame('Rock');
            " class = "move-button" ><img src="rock-emoji.png" class = "move-icon" ></button>




            <button onclick="        
            playGame('Paper');
            " class = "move-button" ><img src="paper-emoji.png" class = "move-icon" 
          ></button>



            <button onclick="        
            playGame('Scissors');
            " class = "move-button" ><img src="scissors-emoji.png" class = "move-icon" > </button>
            <p class="js-result result" >You win</p>
            <p class="js-move" ></p>
            <p class="js-score" ></p>
          
            <button onclick = "
            score.wins = 0
            score.losses = 0
            score.ties = 0
            localStorage.removeItem(score);
            updateScoreElement();
            ">Reset score</button>

        <script>
          
            
            const score = JSON.parse(localStorage.getItem('score')) || {
                    wins: 0,
                    losses: 0,
                    ties: 0
                }
              
              updateScoreElement();
            /*
            if (!score) {
                score = {
                    wins: 0,
                    losses: 0,
                    ties: 0
                };

            }
                */



           function playGame (playerMove) {
            const computerMove = pickComputerMove();
            let result = '';
            if (playerMove === 'Rock') {
              console.log(computerMove);
            if (computerMove === 'Rock') {
                result = 'Tie!';
                score.ties += 1
            } else if (computerMove === 'Paper'){
                result = 'You lose! ';
                score.losses += 1
            } else if (computerMove === 'Scissors'){
                result = 'You win!';
                score.wins += 1
            }

            updateScoreElement();

            document.querySelector('.js-result').innerHTML = result;
            
            document.querySelector('.js-move').innerHTML = ` You ${playerMove} - Computor  ${computerMove}`

            } else if (playerMove === 'Paper') {
            console.log(computerMove);
            if (computerMove === 'Paper') {
                result = 'Tie!';
                score.ties += 1
            } else if (computerMove === 'Scissors'){
                result = 'You lose!';
                score.losses += 1
            } else if (computerMove === 'Rock'){
                result = 'You win!';
                score.wins += 1
            }
          
            updateScoreElement();

            document.querySelector('.js-result').innerHTML = result;
            
            document.querySelector('.js-move').innerHTML = ` You ${playerMove} - Computor  ${computerMove}`

            
          } else if (playerMove === 'Scissors') {

            console.log(computerMove);
            if (computerMove === 'Scissors') {
                result = 'Tie!';
                score.ties += 1
            } else if (computerMove === 'Rock'){
                result = 'You lose!';
                score.losses += 1
            } else if (computerMove === 'Paper'){
                result = 'You win!';
                score.wins += 1
            }

            updateScoreElement();

            document.querySelector('.js-result')
            .innerHTML = result;
            
            document.querySelector('.js-move').innerHTML = ` You ${playerMove} - Computor  ${computerMove}`


          }

        }
        computerMove = '';

      

        function updateScoreElement (){
                    document.querySelector('.js-score').innerHTML = `
            Wins: ${score.wins}  Losses: ${score.losses}, Ties : ${score.ties}`;
        }
        function pickComputerMove(){

        
        randNum = Math.random();

        if (randNum >= 0 && randNum < 1/3){
          computerMove ='Rock';
        } else if (randNum >= 1/3 && randNum < 2/3) {
             computerMove = 'Paper';
        } else if (randNum >= 2/3 && randNum < 1) {
             computerMove = 'Scissors';
        }
        return  computerMove;
      }
        </script>
    </body>
</html>
